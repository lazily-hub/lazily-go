# CI-reachability configuration (#lzcheckcireachguard), read by check-ci-reach.sh.
#
# workflow:  a workflow whose run: steps count as CI reach. Listing one here is a
#            claim that it runs on every push/PR — a tag-triggered release
#            workflow must not be listed, because reaching a gate only when you
#            cut a release is not reaching it.
# excuse:    a `make check` target that CI deliberately does not run, and why.
#
# The excuse list is the point of this file. It is the one place a reader can see
# what this binding does not enforce in CI, in the same spirit as KNOWN_UNCOVERED.
# Excuses are verified in both directions: an excuse for a target CI turns out to
# reach is a hard failure, so this list cannot rot into things that used to be
# true.
#
# An excuse must also name a target INSIDE `check`'s prerequisite closure
# (#pinreachclosure). It did not have to before: appending
# `excuse: bench-scale ...` — a real target in this Makefile that `check` does not
# run — and `excuse: totally-nonexistent-target ...` was measured at
# `OK — 9 target(s) reached by CI, 0 excused`, exit 0. Both were dropped on the
# floor, so this file could claim to account for a gate it does not touch. An
# out-of-closure excuse is now an error naming the entry, the same reverse check
# KNOWN_UNCOVERED applies in scripts/check-conformance-coverage.sh.
#
# Which targets the closure must CONTAIN is pinned separately, in
# EXPECTED_CLOSURE_TARGETS at the top of scripts/check-ci-reach.sh, because that
# is a claim about what this binding DOES enforce rather than what it does not —
# alongside EXPECTED_NOGATE_TARGETS, which pins the targets allowed to be exempt
# from CI reach for carrying no checkable command, EXPECTED_GATE_STEPS, which
# pins WHICH CI STEP runs each gate so that reach is asked inside that step and
# not of the workflow as a whole (#reversereachdirection), and a `make -n` oracle
# that cross-examines the whole source-derived closure against what make really
# runs.
#
# The step mapping changes what an excuse means for the workflows listed here. A
# gate is now unreachable when ITS OWN step stops running it, so a step that was
# renamed, or a recipe repointed at a command some other step already runs, fails
# instead of being absorbed. Neither is an excuse: the first is a mapping to
# update, the second is a Makefile to fix.
#
# An excuse is still the right place for a gate CI deliberately skips. It is the
# WRONG place to silence the oracle: a target that only runs under some make
# condition is not a gate CI skips, it is a gate that reads as enforced and is
# not. Fix the Makefile.

workflow: .github/workflows/ci.yml

# No excuses. Every gate `make check` runs is reached by the CI workflow above,
# which is a claim the guard re-proves on every run rather than a note.
