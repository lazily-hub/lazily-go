name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...

      # The conformance tests resolve fixtures through the sibling-relative path
      # ../lazily-spec/conformance and t.Skip when it is absent, so without this
      # clone every conformance test in the suite reports green while executing
      # nothing. Fixtures are never vendored into this repo — bundled copies
      # drift from the spec.
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      # Assert the fixtures are actually present BEFORE running the suite. A
      # skip-if-absent runner with no guard is worse than no runner at all.
      - name: Guard — canonical fixtures present (#lzspecconf)
        run: |
          test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing — the conformance tests would silently skip"; exit 1; }
          for corpus in collections coordination presence reliable-sync signaling statechart temporal windowing; do
            test -d "../lazily-spec/conformance/$corpus" || { echo "::error::../lazily-spec/conformance/$corpus missing — its conformance runner would silently skip"; exit 1; }
          done

      - name: test
        run: go test ./...

      # Every conformance runner in this repo t.Skip()s when the sibling spec
      # checkout is absent, so "green" and "ran nothing" are indistinguishable
      # from the exit code alone. Replay the whole conformance suite verbosely
      # and require BOTH that it executed a substantial number of fixtures and
      # that not one of them skipped. This asserts against the corpora lazily-go
      # actually consumes — it is not pinned to any single runner, so removing or
      # adding one cannot quietly turn it into a no-op.
      - name: Conformance replay executed, zero skips (#lzspecconf)
        run: |
          out=$(go test -run Conformance -v . 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "::error::a conformance runner skipped — fixtures were not reachable"
            echo "$out" | grep -- "--- SKIP"
            exit 1
          fi
          ran=$(echo "$out" | grep -c "^=== RUN   ")
          echo "conformance subtests executed: $ran"
          if [ "$ran" -lt 100 ]; then
            echo "::error::only $ran conformance subtests ran (expected >= 100) — the corpus is not being replayed"
            exit 1
          fi

      - name: race (cgo)
        run: CGO_ENABLED=1 go test -race ./...
